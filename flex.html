<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXBOX LAYOUT</title>
    <style>
        .container {
            display: flex;
            gap: 10px;
        }

        .box {
            background: rgb(230, 184, 173);
            padding: 25px;
            color: rgba(219, 33, 33, 0.938);
        }
    </style>
<body>
    <div class="container">
        <div class="box">#</div>
        <div class="box">#</div>
        <div class="box">#</div>
        <div class="box">#</div>
        <div class="box">#</div>
    </div>
</body>
</html>
